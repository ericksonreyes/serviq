# Fluent Bit → stdout for local development (minimal footprint).
# Tails Docker container logs and emits them tagged. A searchable sink
# (OpenSearch/Loki → managed logging) is a documented adapter behind the
# observability port — change the [OUTPUT] block to enable it.
# Note: the /var/lib/docker/containers host path is Docker-Desktop-specific;
# OrbStack/colima may expose container logs differently — adjust the input if needed.

[SERVICE]
    Flush         5
    Log_Level     info
    Parsers_File  parsers.conf

[INPUT]
    Name          tail
    Path          /var/lib/docker/containers/*/*.log
    Parser        docker
    Tag           docker.*
    Refresh_Interval 5

[FILTER]
    Name          modify
    Match         docker.*
    Add           environment local

[OUTPUT]
    Name          stdout
    Match         docker.*
    Format        json_lines
