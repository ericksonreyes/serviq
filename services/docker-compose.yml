# ServIQ local development stack
#
# POC target: the full stack runs simultaneously on the reference machine (8GB MacBook Air M1).
# Budget and rationale: workspace/specs/technical/infrastructure/LOCAL_RESOURCE_BUDGET.MD
#
# Profiles:
#   docker compose --profile infra up -d    # datastores, broker, cache, logging only
#   docker compose --profile domain up -d   # infra + Laravel services
#   docker compose --profile ai up -d       # infra + Ollama + AI Agent
#   docker compose --profile full up -d     # everything (the POC target)
#
# Run from this directory — `docker compose` auto-discovers this file. From the repo
# root use: docker compose -f services/docker-compose.yml ...
#
# App services reference Dockerfiles in each sibling directory; they join the stack
# as each service is implemented. Infra works standalone today.

name: serviq

networks:
  serviq:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  ollama-models:
  npm-cache:
x-common-env: &common-env
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  REDIS_HOST: redis
  REDIS_PORT: 6379
  MINIO_ENDPOINT: minio:9000

x-laravel-service: &laravel-service
  profiles: ["domain", "full"]
  networks: [serviq]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  restart: unless-stopped
  mem_limit: 128m

# Event consumers run as dedicated containers — same image + env as their API,
# different command. See workspace/specs/technical/infrastructure/EVENT_DELIVERY.MD.
x-consumer-service: &consumer-service
  profiles: ["domain", "full"]
  networks: [serviq]
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  restart: unless-stopped
  mem_limit: 128m

services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    container_name: infra-postgres
    image: pgvector/pgvector:pg17
    profiles: ["infra", "domain", "ai", "full"]
    networks: [serviq]
    environment:
      POSTGRES_USER: serviq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-serviq}
      POSTGRES_DB: serviq
    command: postgres -c shared_buffers=128MB
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serviq"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m
    restart: unless-stopped

  mongo:
    container_name: infra-mongo
    image: mongo:8
    profiles: ["infra", "domain", "ai", "full"]
    networks: [serviq]
    command: mongod --wiredTigerCacheSizeGB 0.25
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 384m
    restart: unless-stopped

  redis:
    container_name: infra-redis
    image: redis:7-alpine
    profiles: ["infra", "domain", "ai", "full"]
    networks: [serviq]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 64m
    restart: unless-stopped

  rabbitmq:
    container_name: infra-rabbitmq
    image: rabbitmq:4-management-alpine
    # Pin the node name — without it the node is rabbit@<random container
    # hostname>, so every recreate abandons the previous mnesia dir and the
    # named volume keeps orphaned, unreadable copies of users/queues.
    hostname: rabbitmq
    profiles: ["infra", "domain", "ai", "full"]
    networks: [serviq]
    environment:
      # guest/guest is localhost-only in RabbitMQ — containers need real creds
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-serviq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-serviq}
    ports:
      - "127.0.0.1:5672:5672"    # AMQP
      - "127.0.0.1:15672:15672"  # management UI
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 320m
    restart: unless-stopped

  minio:
    container_name: infra-minio
    image: bitnamilegacy/minio:latest
    profiles: ["infra", "domain", "ai", "full"]
    networks: [serviq]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-serviq}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-serviq-local}
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # console
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 256m
    restart: unless-stopped

  # Log aggregation is intentionally minimal locally: Fluent Bit collects
  # container logs to stdout. A searchable sink (OpenSearch/Loki → managed
  # logging) remains a documented adapter behind the observability port —
  # see LOCAL_RESOURCE_BUDGET.MD.
  fluent-bit:
    container_name: infra-fluent-bit
    image: fluent/fluent-bit:4.2
    profiles: ["infra", "domain", "ai", "full"]
    networks: [serviq]
    volumes:
      - ../workspace/infra/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    mem_limit: 64m
    restart: unless-stopped

  ollama:
    container_name: infra-ollama
    image: ollama/ollama:latest
    profiles: ["ai", "full"]
    networks: [serviq]
    environment:
      OLLAMA_KEEP_ALIVE: 2m          # unload model weights between calls — RAM is the constraint
      OLLAMA_MAX_LOADED_MODELS: "1"  # one model resident at a time — vision+text together would exceed the cap
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama-models:/root/.ollama]
    mem_limit: 4g
    restart: unless-stopped

  # ── Edges (BFFs) ───────────────────────────────────────────────────────────
  # Node services, `node src` production command.

  customer-portal-bff:
    container_name: serviq-customer-portal-bff
    build: ./serviq-customer-portal-bff
    env_file: ./serviq-customer-portal-bff/.env
    volumes: ["./serviq-customer-portal-bff:/app", "npm-cache:/root/.npm"]
    command: 'sh -c "[ -d node_modules ] || npm install --omit=dev; exec node --watch src/index.js"'
    profiles: ["domain", "full"]
    networks: [serviq]
    ports: ["3000:3000"]
    environment:
      <<: *common-env
      MONGODB_URI: mongodb://mongo:27017/serviq_portal
    depends_on:
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    mem_limit: 256m

  service-agent-bff:
    container_name: serviq-service-agent-bff
    build: ./serviq-service-agent-bff
    env_file: ./serviq-service-agent-bff/.env
    volumes: ["./serviq-service-agent-bff:/app", "npm-cache:/root/.npm"]
    command: 'sh -c "[ -d node_modules ] || npm install --omit=dev; exec node --watch src/index.js"'
    profiles: ["domain", "full"]
    networks: [serviq]
    ports: ["3001:3000"]
    environment:
      <<: *common-env
    depends_on: [redis]
    mem_limit: 256m

  # ── Domain command APIs (Laravel, php:apache) ──────────────────────────────
  # One entry per bounded context. Host port convention: 80xx range.
  # Source dirs are bind-mounted (deps included — install via composer:2
  # one-off per README) so edits are live; mod_php re-reads per request.

  identity-access-backend:
    container_name: serviq-identity-access-backend
    <<: *laravel-service
    build: ./serviq-identity-access-backend
    env_file: ./serviq-identity-access-backend/.env
    volumes: ["./serviq-identity-access-backend:/var/www/html"]
    ports: ["8010:80"]
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
  #
  platform-management-backend:
    container_name: serviq-platform-management-backend
    <<: *laravel-service
    build: ./serviq-platform-management-backend
    env_file: ./serviq-platform-management-backend/.env
    volumes: ["./serviq-platform-management-backend:/var/www/html"]
    ports: ["8011:80"]
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
  #
  service-management-backend:
    container_name: serviq-service-management-backend
    <<: *laravel-service
    build: ./serviq-service-management-backend
    env_file: ./serviq-service-management-backend/.env
    volumes: ["./serviq-service-management-backend:/var/www/html"]
    ports: ["8012:80"]
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
  #
  customer-request-backend:
    container_name: serviq-customer-request-backend
    <<: *laravel-service
    build: ./serviq-customer-request-management-backend
    env_file: ./serviq-customer-request-management-backend/.env
    volumes: ["./serviq-customer-request-management-backend:/var/www/html"]
    ports: ["8013:80"]
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
  #
  service-job-backend:
    container_name: serviq-service-job-backend
    <<: *laravel-service
    build: ./serviq-service-job-management-backend
    env_file: ./serviq-service-job-management-backend/.env
    volumes: ["./serviq-service-job-management-backend:/var/www/html"]
    ports: ["8014:80"]
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
  #
  workforce-backend:
    container_name: serviq-workforce-backend
    <<: *laravel-service
    build: ./serviq-workforce-management-backend
    env_file: ./serviq-workforce-management-backend/.env
    volumes: ["./serviq-workforce-management-backend:/var/www/html"]
    ports: ["8015:80"]
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
  #
  assignment-dispatch-backend:
    container_name: serviq-assignment-dispatch-backend
    <<: *laravel-service
    build: ./serviq-assignment-dispatch-backend
    env_file: ./serviq-assignment-dispatch-backend/.env
    volumes: ["./serviq-assignment-dispatch-backend:/var/www/html"]
    ports: ["8016:80"]
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
  #
  field-service-backend:
    container_name: serviq-field-service-backend
    <<: *laravel-service
    build: ./serviq-field-service-execution-backend
    env_file: ./serviq-field-service-execution-backend/.env
    volumes: ["./serviq-field-service-execution-backend:/var/www/html"]
    ports: ["8017:80"]
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
  #
  customer-support-backend:
    container_name: serviq-customer-support-backend
    <<: *laravel-service
    build: ./serviq-customer-support-backend
    env_file: ./serviq-customer-support-backend/.env
    volumes: ["./serviq-customer-support-backend:/var/www/html"]
    ports: ["8018:80"]
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
  #
  notification-backend:
    container_name: serviq-notification-backend
    <<: *laravel-service
    build: ./serviq-notification-backend
    env_file: ./serviq-notification-backend/.env
    volumes: ["./serviq-notification-backend:/var/www/html"]
    ports: ["8019:80"]
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
  #
  billing-backend:
    container_name: serviq-billing-backend
    <<: *laravel-service
    build: ./serviq-billing-backend
    env_file: ./serviq-billing-backend/.env
    volumes: ["./serviq-billing-backend:/var/www/html"]
    ports: ["8020:80"]
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
  #
  payouts-backend:
    container_name: serviq-payouts-backend
    <<: *laravel-service
    build: ./serviq-payouts-backend
    env_file: ./serviq-payouts-backend/.env
    volumes: ["./serviq-payouts-backend:/var/www/html"]
    ports: ["8021:80"]
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  # ── Event consumers ────────────────────────────────────────────────────────
  # One dedicated consumer container per subscribing service — never shares the
  # API process. Same image + env_file, different command; no ports (healthcheck
  # is the worker loop). See workspace/specs/technical/infrastructure/EVENT_DELIVERY.MD

  # Consumer runs the outbox relay alongside the RabbitMQ subscriber — one
  # dedicated container for all of this service's broker traffic.
  identity-access-consumer:
    container_name: serviq-identity-access-consumer
    <<: *consumer-service
    build: ./serviq-identity-access-backend
    env_file: ./serviq-identity-access-backend/.env
    volumes: ["./serviq-identity-access-backend:/var/www/html"]
    environment:
      <<: *common-env
      SKIP_DB_SETUP: "true"
    command: "sh -c '(until php artisan outbox:publish; do sleep 5; done) & exec php artisan events:consume'"
  # Platform Management only publishes today — its consumer container runs
  # the outbox relay (events:consume lands with its first subscription).
  platform-management-consumer:
    container_name: serviq-platform-management-consumer
    <<: *consumer-service
    build: ./serviq-platform-management-backend
    env_file: ./serviq-platform-management-backend/.env
    volumes: ["./serviq-platform-management-backend:/var/www/html"]
    environment:
      <<: *common-env
      SKIP_DB_SETUP: "true"
    command: "sh -c 'until php artisan outbox:publish; do sleep 5; done'"
  service-management-consumer:
    container_name: serviq-service-management-consumer
    <<: *consumer-service
    build: ./serviq-service-management-backend
    env_file: ./serviq-service-management-backend/.env
    volumes: ["./serviq-service-management-backend:/var/www/html"]
    environment:
      <<: *common-env
      SKIP_DB_SETUP: "true"
    command: "sh -c 'until php artisan outbox:publish; do sleep 5; done'"
  customer-request-consumer:
    container_name: serviq-customer-request-consumer
    <<: *consumer-service
    build: ./serviq-customer-request-management-backend
    env_file: ./serviq-customer-request-management-backend/.env
    volumes: ["./serviq-customer-request-management-backend:/var/www/html"]
    environment:
      <<: *common-env
      SKIP_DB_SETUP: "true"
    command: "sh -c 'until php artisan outbox:publish; do sleep 5; done'"
  service-job-consumer:
    container_name: serviq-service-job-consumer
    <<: *consumer-service
    build: ./serviq-service-job-management-backend
    env_file: ./serviq-service-job-management-backend/.env
    volumes: ["./serviq-service-job-management-backend:/var/www/html"]
    environment:
      <<: *common-env
      SKIP_DB_SETUP: "true"
    command: "sh -c '(until php artisan outbox:publish; do sleep 5; done) & exec php artisan events:consume'"
  workforce-consumer:
    container_name: serviq-workforce-consumer
    <<: *consumer-service
    build: ./serviq-workforce-management-backend
    env_file: ./serviq-workforce-management-backend/.env
    volumes: ["./serviq-workforce-management-backend:/var/www/html"]
    environment:
      <<: *common-env
      SKIP_DB_SETUP: "true"
    command: "sh -c 'until php artisan outbox:publish; do sleep 5; done'"
  assignment-dispatch-consumer:
    container_name: serviq-assignment-dispatch-consumer
    <<: *consumer-service
    build: ./serviq-assignment-dispatch-backend
    env_file: ./serviq-assignment-dispatch-backend/.env
    volumes: ["./serviq-assignment-dispatch-backend:/var/www/html"]
    environment:
      <<: *common-env
      SKIP_DB_SETUP: "true"
    command: "sh -c '(until php artisan outbox:publish; do sleep 5; done) & (until php artisan offers:expire; do sleep 5; done) & exec php artisan events:consume'"
  field-service-consumer:
    container_name: serviq-field-service-consumer
    <<: *consumer-service
    build: ./serviq-field-service-execution-backend
    env_file: ./serviq-field-service-execution-backend/.env
    volumes: ["./serviq-field-service-execution-backend:/var/www/html"]
    environment:
      <<: *common-env
      SKIP_DB_SETUP: "true"
    command: "sh -c '(until php artisan outbox:publish; do sleep 5; done) & exec php artisan events:consume'"
  customer-support-consumer:
    container_name: serviq-customer-support-consumer
    <<: *consumer-service
    build: ./serviq-customer-support-backend
    env_file: ./serviq-customer-support-backend/.env
    volumes: ["./serviq-customer-support-backend:/var/www/html"]
    environment:
      <<: *common-env
      SKIP_DB_SETUP: "true"
    command: "sh -c '(until php artisan outbox:publish; do sleep 5; done) & exec php artisan events:consume'"
  notification-consumer:
    container_name: serviq-notification-consumer
    <<: *consumer-service
    build: ./serviq-notification-backend
    env_file: ./serviq-notification-backend/.env
    volumes: ["./serviq-notification-backend:/var/www/html"]
    environment:
      <<: *common-env
      SKIP_DB_SETUP: "true"
    command: "sh -c '(until php artisan outbox:publish; do sleep 5; done) & exec php artisan events:consume'"
  billing-consumer:
    container_name: serviq-billing-consumer
    <<: *consumer-service
    build: ./serviq-billing-backend
    env_file: ./serviq-billing-backend/.env
    volumes: ["./serviq-billing-backend:/var/www/html"]
    environment:
      <<: *common-env
      SKIP_DB_SETUP: "true"
    command: "sh -c '(until php artisan outbox:publish; do sleep 5; done) & exec php artisan events:consume'"
  payouts-consumer:
    container_name: serviq-payouts-consumer
    <<: *consumer-service
    build: ./serviq-payouts-backend
    env_file: ./serviq-payouts-backend/.env
    volumes: ["./serviq-payouts-backend:/var/www/html"]
    environment:
      <<: *common-env
      SKIP_DB_SETUP: "true"
    command: "sh -c '(until php artisan outbox:publish; do sleep 5; done) & exec php artisan events:consume'"
  customer-portal-bff-consumer:
    container_name: serviq-customer-portal-bff-consumer
    <<: *consumer-service
    build: ./serviq-customer-portal-bff
    env_file: ./serviq-customer-portal-bff/.env
    volumes: ["./serviq-customer-portal-bff:/app", "npm-cache:/root/.npm"]
    command: 'sh -c "[ -d node_modules ] || npm install --omit=dev; exec node --watch src/consumer.js"'
    mem_limit: 128m
  ai-agent-consumer:
    container_name: serviq-ai-agent-consumer
    <<: *consumer-service
    build: ./serviq-ai-agent
    env_file: ./serviq-ai-agent/.env
    volumes: ["./serviq-ai-agent:/app"]
    profiles: ["ai", "full"]
    command: "python -m app.consumer"
    mem_limit: 128m

  # ── AI ─────────────────────────────────────────────────────────────────────

  ai-agent:
    container_name: serviq-ai-agent
    build: ./serviq-ai-agent
    env_file: ./serviq-ai-agent/.env
    volumes: ["./serviq-ai-agent:/app"]
    command: 'uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload'
    profiles: ["ai", "full"]
    networks: [serviq]
    ports: ["8100:8000"]
    environment:
      <<: *common-env
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
        required: false
    mem_limit: 256m

  # ── Frontends (vite dev servers + hot reload, 8080-8083) ───────────────────
  # Development shape is the only frontend shape: bind-mounted source +
  # host-resident node_modules (self-installs on boot).

  customer-portal-dev:
    container_name: serviq-customer-portal-dev
    image: node:22-alpine
    profiles: [dev, full]
    networks: [serviq]
    working_dir: /app
    volumes: ["./serviq-customer-portal-frontend:/app", "npm-cache:/root/.npm"]
    ports: ["8080:5173"]
    command: 'sh -c "[ -d node_modules ] || npm install; exec npm run dev -- --host"'
    mem_limit: 256m

  service-agent-dev:
    container_name: serviq-service-agent-dev
    image: node:22-alpine
    profiles: [dev, full]
    networks: [serviq]
    working_dir: /app
    volumes: ["./serviq-service-agent-frontend:/app", "npm-cache:/root/.npm"]
    ports: ["8081:5173"]
    command: 'sh -c "[ -d node_modules ] || npm install; exec npm run dev -- --host"'
    mem_limit: 256m

  tenant-console-dev:
    container_name: serviq-tenant-console-dev
    image: node:22-alpine
    profiles: [dev, full]
    networks: [serviq]
    working_dir: /app
    volumes: ["./serviq-tenant-console-frontend:/app", "npm-cache:/root/.npm"]
    ports: ["8082:5173"]
    command: 'sh -c "[ -d node_modules ] || npm install; exec npm run dev -- --host"'
    mem_limit: 256m

  platform-admin-dev:
    container_name: serviq-platform-admin-dev
    image: node:22-alpine
    profiles: [dev, full]
    networks: [serviq]
    working_dir: /app
    volumes: ["./serviq-platform-admin-frontend:/app", "npm-cache:/root/.npm"]
    ports: ["8083:5173"]
    command: 'sh -c "[ -d node_modules ] || npm install; exec npm run dev -- --host"'
    mem_limit: 256m
